# Canu, Bandage and Augustus, added at MPI's request (D. Waite, Aug 2026).
# Kept in their own environment: all three need zlib >= 1.3.2, which conflicts
# with the older zlib pinned by samtools 1.16.1 and friends in `assembly`.
#   canu     - configurable long read assembler, alternative to Raven
#   bandage  - assembly graph visualiser, run headless (see tools.tsv)
#   augustus - eukaryote gene prediction
name: extras
channels:
  - conda-forge
  - bioconda
dependencies:
  - canu=2.3
  - bandage=0.9.0
  - augustus=3.5.0
