# Read QC, trimming and sequence manipulation tools.
# seqtk is pinned to 1.4: 1.5 requires zlib >= 1.3.2, which conflicts with the
# zlib pinned by the rest of this environment.
name: qc
channels:
  - conda-forge
  - bioconda
dependencies:
  - fastqc=0.12.1
  - fastp=1.0.1
  - seqkit=2.10.1
  - seqtk=1.4
  - porechop=0.2.4
  - nanofilt=2.8.0
  - pycoqc=2.5.2
